# Keep pipeline-pack/index.html on main.
#
# desk-bot pushes "update TIMESTAMP CDT" about once a minute and refreshes
# index.html and cb.html. Those commits are not patches on top of origin/main.
# Squash merge a6524be2 (14:36:17 CDT) added pipeline-pack/index.html.
# desk-bot 58c5c838 (14:36:19 CDT, parent a6524be2) deleted it. The tree of
# 58c5c838 versus the pre-merge bot commit differs only in index.html and
# cb.html, which is what you get from a stale worktree:
#   git reset --soft origin/main && git add -A && git commit && git push
# or from copying a fixed file set that omits pipeline-pack/.
# A push that lands while that cycle is open gets dropped. A push that is
# already on main when the next cycle checks out origin/main is kept, but a
# later mid-cycle push can drop the directory again.
#
# This workflow is the part the sync cannot drop once a cycle has checked it
# out: on every main push (and every few minutes), if pipeline-pack/index.html
# is missing, put back the exact blob from a6524be2. It does not touch
# index.html, lab.html, or cb.html.

name: keep-pipeline-pack

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-pipeline-pack
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Restore pipeline-pack if the minute publisher dropped it
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [ -f pipeline-pack/index.html ]; then
            echo "pipeline-pack/index.html present"
            exit 0
          fi
          git fetch origin a6524be2f20c9b9a519118d8b7311e9e48a968c3
          git checkout a6524be2f20c9b9a519118d8b7311e9e48a968c3 -- pipeline-pack/index.html
          test "$(git hash-object pipeline-pack/index.html)" = "8910b372da125f3c9c8a3a0cb500336904d527e3"
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git add pipeline-pack/index.html
          git commit -m "keep pipeline-pack/index.html"
          git push origin HEAD:main
